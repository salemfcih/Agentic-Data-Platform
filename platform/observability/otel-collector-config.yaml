receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  attributes/governance:
    actions:
      - key: platform.name
        value: aegislake
        action: upsert
      - key: deployment.plane
        value: sovereign-openshift
        action: upsert

exporters:
  otlphttp/grafana_lgtm:
    endpoint: http://grafana-lgtm:4318
  otlphttp/langfuse:
    endpoint: http://langfuse:3000/api/public/otel
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/governance, batch]
      exporters: [otlphttp/grafana_lgtm, otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [attributes/governance, batch]
      exporters: [otlphttp/grafana_lgtm]
    logs:
      receivers: [otlp]
      processors: [attributes/governance, batch]
      exporters: [otlphttp/grafana_lgtm]
