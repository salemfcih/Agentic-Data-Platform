  <script>
    /**
     * ============================================================================
     * AEGISLAKE SVG ARCHITECTURE GENERATOR & INTERACTIVE STUDIO
     * ============================================================================
     * Generates all SVG primitives with explicit inline font-family, font-size,
     * font-weight, and fill attributes so exported .SVG files open identically
     * across Chrome, GitHub READMEs, PowerPoint, Draw.io, and Figma.
     */
    (function () {
      'use strict';

      const SVG_NS = 'http://www.w3.org/2000/svg';
      const FONT_STACK = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif";

      /* --------------------------------------------------------------------------
       * Low-Level SVG Element Helpers
       * -------------------------------------------------------------------------- */
      function el(tag, attrs = {}, textContent = null) {
        const node = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (v !== null && v !== undefined) node.setAttribute(k, String(v));
        }
        if (textContent !== null) node.textContent = textContent;
        return node;
      }

      function addText(parent, x, y, text, opts = {}) {
        const node = el('text', {
          x,
          y,
          'font-family': FONT_STACK,
          'font-size': opts.size || 10.5,
          'font-weight': opts.weight || 400,
          fill: opts.fill || '#1E293B',
          'text-anchor': opts.anchor || 'start',
          'letter-spacing': opts.spacing || null
        }, text);
        parent.appendChild(node);
        return node;
      }

      /**
       * Renders a rounded pill badge anchored to the right edge (rightX).
       * Width is calculated cleanly from label length to prevent clipping.
       */
      function addBadge(parent, rightX, y, label, bg, fg, strokeColor = null) {
        const charW = 5.4;
        const w = Math.max(40, Math.round(label.length * charW + 14));
        const h = 16;
        const x = rightX - w;
        parent.appendChild(el('rect', {
          x, y, width: w, height: h, rx: 8,
          fill: bg,
          stroke: strokeColor || 'none',
          'stroke-width': strokeColor ? 0.8 : 0
        }));
        addText(parent, x + w / 2, y + 11.2, label, {
          size: 8.2,
          weight: 700,
          fill: fg,
          anchor: 'middle',
          spacing: '0.35'
        });
        return w;
      }

      /**
       * Renders a standard architecture component card with header, pill badge,
       * subtle divider, and bulleted responsibility lines.
       */
      function drawCard(parent, cfg) {
        const {
          x, y, w, h,
          title, badge, bullets,
          accent = '#0F766E',
          bg = '#FFFFFF',
          border = '#CBD5E1',
          badgeBg = '#CCFBF1',
          badgeFg = '#0F766E',
          titleSize = 10.8,
          bulletSize = 9.8,
          bulletGap = 17.5,
          bulletStartOffset = 46,
          compactHeader = false
        } = cfg;

        const g = el('g');

        // Card Container
        g.appendChild(el('rect', {
          x, y, width: w, height: h, rx: 7,
          fill: bg,
          stroke: border,
          'stroke-width': 1.15,
          filter: 'url(#card-shadow)'
        }));

        // Left vertical accent indicator bar
        g.appendChild(el('rect', {
          x: x + 0.6,
          y: y + 6,
          width: 3.4,
          height: h - 12,
          rx: 1.7,
          fill: accent
        }));

        // Header Pill Badge (right-aligned)
        const headerY = compactHeader ? y + 17 : y + 19;
        const badgeY = compactHeader ? y + 6 : y + 7.5;
        if (badge) {
          addBadge(g, x + w - 8, badgeY, badge, badgeBg, badgeFg);
        }

        // Card Title
        addText(g, x + 11, headerY, title, {
          size: titleSize,
          weight: 700,
          fill: '#0F172A'
        });

        // Subtle Header Divider
        const divY = compactHeader ? y + 26 : y + 29;
        g.appendChild(el('line', {
          x1: x + 10, y1: divY, x2: x + w - 10, y2: divY,
          stroke: '#E2E8F0',
          'stroke-width': 1
        }));

        // Bullet List
        bullets.forEach((line, idx) => {
          const ly = y + bulletStartOffset + idx * bulletGap;
          // Crisp bullet dot
          g.appendChild(el('circle', {
            cx: x + 14.5,
            cy: ly - 3.2,
            r: 2.1,
            fill: accent
          }));
          addText(g, x + 21.5, ly, line, {
            size: bulletSize,
            weight: 400,
            fill: '#334155'
          });
        });

        parent.appendChild(g);
      }

      /**
       * Renders a horizontal center layer outer frame + colored title header strip.
       */
      function drawLayerFrame(parent, x, y, w, h, title, color, tintBg, borderColor) {
        // Outer rounded container
        parent.appendChild(el('rect', {
          x, y, width: w, height: h, rx: 10,
          fill: tintBg,
          stroke: borderColor || color,
          'stroke-width': 1.5
        }));

        // Rounded top header bar using path (rounded top corners, square bottom)
        const hh = 28;
        const r = 9.5;
        const d = [
          `M ${x} ${y + r}`,
          `Q ${x} ${y} ${x + r} ${y}`,
          `L ${x + w - r} ${y}`,
          `Q ${x + w} ${y} ${x + w} ${y + r}`,
          `L ${x + w} ${y + hh}`,
          `L ${x} ${y + hh} Z`
        ].join(' ');
        parent.appendChild(el('path', { d, fill: color }));

        addText(parent, x + 14, y + 18.5, title, {
          size: 11.4,
          weight: 800,
          fill: '#FFFFFF',
          spacing: '0.45'
        });
      }

      /**
       * Renders a vertical side pillar frame + deep colored 2-line header.
       */
      function drawPillarFrame(parent, x, y, w, h, title, subtitle, color, tintBg, subFill) {
        parent.appendChild(el('rect', {
          x, y, width: w, height: h, rx: 10,
          fill: tintBg,
          stroke: color,
          'stroke-width': 1.6
        }));

        const hh = 54;
        const r = 9.5;
        const d = [
          `M ${x} ${y + r}`,
          `Q ${x} ${y} ${x + r} ${y}`,
          `L ${x + w - r} ${y}`,
          `Q ${x + w} ${y} ${x + w} ${y + r}`,
          `L ${x + w} ${y + hh}`,

            anchor: 'middle'

      /* --------------------------------------------------------------------------
       * 9. BOTTOM FOUNDATION BAR — HYBRID DEPLOYMENT SUBSTRATE (#0F172A)
       * -------------------------------------------------------------------------- */
      function buildFoundation() {
        const root = document.getElementById('svg-foundation');

        root.appendChild(el('rect', {

          size: 10.6,
          weight: 800,
          fill: '#F1F5F9',

        });

        // Left Box: Sovereign On-Premises Plane
        const lx = 32, by = y + 30, bw = 886, bh = 68;

        addText(root, lx + 14, by + 19, 'SOVEREIGN ON-PREMISES PLANE (RED HAT OPENSHIFT / KUBERNETES · GITOPS ARGOCD · KEDA)', {
          size: 10.6,
          weight: 800,
          fill: '#38BDF8',

        addText(root, lx + 14, by + 39, 'Apigee Hybrid · Confluent CFK · Debezium · IDMC/NiFi · Apache Ozone/Ceph · Iceberg + Polaris + Gravitino', {
          size: 10.2,

        });
        addText(root, lx + 14, by + 56, 'Spark / Flink / Trino / StarRocks · Cube · Feast · MLflow · KServe/vLLM · DataHub · Ranger · OPA · Langfuse', {
          size: 10.2,

        // Center Bidirectional Portability Arrows
        const midX = 960;
        root.appendChild(el('line', {
          x1: 928, y1: by + 27, x2: 992, y2: by + 27,
          stroke: '#34D399',
          'stroke-width': 2.2,
          'marker-end': 'url(#arrow-port-r)'
        }));
        root.appendChild(el('line', {
          x1: 992, y1: by + 41, x2: 928, y2: by + 41,
          stroke: '#38BDF8',
          'stroke-width': 2.2,

        }));
        addText(root, midX, by + 59, 'PORTABLE', {
          size: 8.4,
          weight: 700,
          fill: '#94A3B8',
          anchor: 'middle',
          spacing: '0.6'
        });

        // Right Box: Managed Cloud-Native Mapping
        const rx = 1002;
        root.appendChild(el('rect', {
          x: rx, y: by, width: bw, height: bh, rx: 7,
          fill: '#1E293B',
          stroke: '#10B981',
          'stroke-width': 1.5
        }));
        addText(root, rx + 14, by + 19, 'MANAGED CLOUD-NATIVE MAPPING (GOOGLE CLOUD REFERENCE BLUEPRINT — ELASTIC & FRONTIER AI)', {
          size: 10.6,
          weight: 800,
          fill: '#34D399',
          spacing: '0.3'
        });
        addText(root, rx + 14, by + 39, 'Apigee Platform · Pub/Sub + Eventarc · Datastream CDC · Dataflow + Dataform · GCS + BigQuery / BigLake', {
          size: 10.2,
          weight: 500,
          fill: '#E2E8F0'
        });
        addText(root, rx + 14, by + 56, 'Cloud SQL / Bigtable · Dataplex + DLP · Looker · Vertex AI (Workbench / Features / Agents) · Composer', {
          size: 10.2,

      /* --------------------------------------------------------------------------
       * 10. CONNECTING ARROWS (Primary Vertical, Governance Left, Self-X Right)
       * -------------------------------------------------------------------------- */
      function buildConnectors() {
        const flowRoot = document.getElementById('svg-connectors-flow');
        const govRoot = document.getElementById('svg-connectors-gov');
        const selfxRoot = document.getElementById('svg-connectors-selfx');

        // A. Primary Top-to-Bottom Labeled Inter-Layer Flows
        const gaps = [
          { y1: 220, y2: 242, label: 'CDC · Event Streams · REST/SaaS APIs · Partner SFTP & Multimodal Files' },
          { y1: 372, y2: 394, label: 'Iceberg WAP Writes · Multimodal Object Drops · Vector & Graph Indexing' },
          { y1: 604, y2: 626, label: 'Polaris Vended Iceberg Reads · Stateful Flink Streams · Federated SQL' },
          { y1: 756, y2: 778, label: 'Certified Features · Semantic KPIs · Gold Data Products · Temporal Flows' },
          { y1: 1048, y2: 1070, label: 'Governed MCP Tools · Certified Data Products · Conversational & BI APIs' }
        ];

        // Flanking arrow X-positions leave the central label 100% clear of vertical lines
        const arrowXs = [468, 608, 1312, 1452];

        gaps.forEach((g) => {
          arrowXs.forEach((ax) => {
            flowRoot.appendChild(el('line', {
              x1: ax, y1: g.y1, x2: ax, y2: g.y2 - 2,
              stroke: '#0284C7',
              'stroke-width': 2,
              'marker-end': 'url(#arrow-primary)'
            }));
          });

          // Centered Flow Label Pill
          const midY = (g.y1 + g.y2) / 2;
          const pw = Math.round(g.label.length * 5.6 + 26);
          flowRoot.appendChild(el('rect', {
            x: 960 - pw / 2,
            y: midY - 9,
            width: pw,
            height: 18,
            rx: 9,
            fill: '#E0F2FE',
            stroke: '#7DD3FC',
            'stroke-width': 1
          }));
          addText(flowRoot, 960, midY + 3.4, g.label, {
            size: 9.4,
            weight: 700,
            fill: '#0369A1',
            anchor: 'middle'
          });
        });

        // B. Horizontal Dashed Teal Arrows: Left Pillar -> Center Layers (1..5)
        // C. Horizontal Bidirectional Dashed Purple Arrows: Center Layers (1..5) <-> Right Pillar
        const horizontalYs = [308, 500, 692, 914, 1183];

        horizontalYs.forEach((hy) => {
          // Left Pillar (336) -> Center Stack (372)
          govRoot.appendChild(el('line', {
            x1: 336, y1: hy, x2: 370, y2: hy,
            stroke: '#0F766E',
            'stroke-width': 2,
            'stroke-dasharray': '4.5,3',
            'marker-end': 'url(#arrow-gov)'
          }));

          // Center Stack (1548) <-> Right Pillar (1582)
          selfxRoot.appendChild(el('line', {
            x1: 1550, y1: hy, x2: 1580, y2: hy,
            stroke: '#6D28D9',
            'stroke-width': 2,
            'stroke-dasharray': '4.5,3',
            'marker-start': 'url(#arrow-selfx-rev)',
            'marker-end': 'url(#arrow-selfx)'
          }));
        });
      }

      /* Build complete vector blueprint on initialization */
      buildLeftPillar();
      buildRightPillar();
      buildLayer0();
      buildLayer1();
      buildLayer2();
      buildLayer3();
      buildLayer4();
      buildLayer5();
      buildFoundation();
      buildConnectors();

      /* ==========================================================================
       * INTERACTIVE STUDIO: PAN, ZOOM, LAYER HIGHLIGHTING & EXPORTS
       * ========================================================================== */
      const viewport = document.getElementById('viewport');
      const stage = document.getElementById('stage');
      const svgEl = document.getElementById('architecture-svg');
      const zoomReadout = document.getElementById('zoom-readout');

      const SVG_W = 1920;
      const SVG_H = 1430;

      const state = {
        scale: 1,
        tx: 0,
        ty: 0,
        minScale: 0.2,
        maxScale: 3.0,
        dragging: false,
        startX: 0,
        startY: 0,
        origTx: 0,
        origTy: 0,
        activeFilter: 'all'
      };

      function applyTransform() {
        stage.style.transform = `translate3d(${state.tx}px, ${state.ty}px, 0) scale(${state.scale})`;
        zoomReadout.textContent = `${Math.round(state.scale * 100)}%`;
      }

      function fitToScreen() {
        const rect = viewport.getBoundingClientRect();
        const pad = 28;
        const scaleX = (rect.width - pad * 2) / SVG_W;
        const scaleY = (rect.height - pad * 2) / SVG_H;
        state.scale = Math.max(state.minScale, Math.min(1.15, Math.min(scaleX, scaleY)));
        state.tx = (rect.width - SVG_W * state.scale) / 2;
        state.ty = (rect.height - SVG_H * state.scale) / 2;
        applyTransform();
      }

      function resetZoom100() {
        const rect = viewport.getBoundingClientRect();
        state.scale = 1;
        state.tx = Math.max(16, (rect.width - SVG_W) / 2);
        state.ty = 16;
        applyTransform();
      }

      function zoomAtPoint(factor, clientX, clientY) {
        const rect = viewport.getBoundingClientRect();
        const mouseX = clientX - rect.left;
        const mouseY = clientY - rect.top;

        const nextScale = Math.max(state.minScale, Math.min(state.maxScale, state.scale * factor));
        const ratio = nextScale / state.scale;

        state.tx = mouseX - (mouseX - state.tx) * ratio;
        state.ty = mouseY - (mouseY - state.ty) * ratio;
        state.scale = nextScale;
        applyTransform();
      }

      function zoomCentered(factor) {
        const rect = viewport.getBoundingClientRect();
        zoomAtPoint(factor, rect.left + rect.width / 2, rect.top + rect.height / 2);
      }

      /* Mouse Wheel Zoom */
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
        zoomAtPoint(factor, e.clientX, e.clientY);
      }, { passive: false });

      /* Click-and-Drag Pan */
      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        state.dragging = true;
        state.startX = e.clientX;
        state.startY = e.clientY;
        state.origTx = state.tx;
        state.origTy = state.ty;
      });

      window.addEventListener('mousemove', (e) => {
        if (!state.dragging) return;
        state.tx = state.origTx + (e.clientX - state.startX);
        state.ty = state.origTy + (e.clientY - state.startY);
        applyTransform();
      });

      window.addEventListener('mouseup', () => {
        state.dragging = false;
      });

      /* Touch Pan & Pinch Zoom Support */
      let lastTouchDist = null;
      viewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          state.dragging = true;
          state.startX = e.touches[0].clientX;
          state.startY = e.touches[0].clientY;
          state.origTx = state.tx;
          state.origTy = state.ty;
        } else if (e.touches.length === 2) {
          state.dragging = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          lastTouchDist = Math.hypot(dx, dy);
        }
      }, { passive: true });

      viewport.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && state.dragging) {
          e.preventDefault();
          state.tx = state.origTx + (e.touches[0].clientX - state.startX);
          state.ty = state.origTy + (e.touches[0].clientY - state.startY);
          applyTransform();
        } else if (e.touches.length === 2 && lastTouchDist) {
          e.preventDefault();
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          zoomAtPoint(dist / lastTouchDist, midX, midY);
          lastTouchDist = dist;
        }
      }, { passive: false });

      viewport.addEventListener('touchend', () => {
        state.dragging = false;
        lastTouchDist = null;
      });

      /* Toolbar Zoom Buttons */
      document.getElementById('btn-zoom-in').addEventListener('click', () => zoomCentered(1.2));
      document.getElementById('btn-zoom-out').addEventListener('click', () => zoomCentered(1 / 1.2));
      document.getElementById('btn-fit').addEventListener('click', fitToScreen);
      document.getElementById('btn-reset').addEventListener('click', resetZoom100);

      /* Keyboard Shortcuts (+, -, 0) */
      window.addEventListener('keydown', (e) => {
        if (e.key === '+' || e.key === '=') zoomCentered(1.18);
        else if (e.key === '-') zoomCentered(1 / 1.18);
        else if (e.key === '0') fitToScreen();
      });

      /* Layer Highlight Filter Logic */
      const filterButtons = document.querySelectorAll('.filter-btn');
      const layerGroups = svgEl.querySelectorAll('g[data-layer]');

      function applyLayerFilter(filterName) {
        state.activeFilter = filterName;

        filterButtons.forEach((btn) => {
          const isActive = btn.dataset.filter === filterName;
          btn.className = isActive
            ? 'filter-btn px-2.5 py-1 rounded-full text-xs font-semibold bg-sky-500/20 text-sky-300 border border-sky-400/60 transition shrink-0 cursor-pointer'
            : 'filter-btn px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700 hover:border-slate-500 hover:text-white transition shrink-0 cursor-pointer';
        });

        layerGroups.forEach((g) => {
          const layerKey = g.getAttribute('data-layer');
          if (filterName === 'all') {
            g.style.opacity = '1';
          } else if (layerKey === filterName) {
            g.style.opacity = '1';
          } else {
            g.style.opacity = '0.2';
          }
        });
      }

      filterButtons.forEach((btn) => {
        btn.addEventListener('click', () => applyLayerFilter(btn.dataset.filter));
      });

      /* --------------------------------------------------------------------------
       * Toast Notification Helper (Replaces alert())
       * -------------------------------------------------------------------------- */
      function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const palette = type === 'error'
          ? 'bg-rose-950/95 border-rose-500/70 text-rose-100'
          : 'bg-slate-900/95 border-emerald-500/70 text-emerald-100';
        toast.className = `px-4 py-2 rounded-lg border text-xs font-semibold shadow-xl backdrop-blur transition-all duration-300 opacity-0 translate-y-2 ${palette}`;
        toast.textContent = message;
        container.appendChild(toast);

        requestAnimationFrame(() => {
          toast.classList.remove('opacity-0', 'translate-y-2');
        });

        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => toast.remove(), 300);
        }, 2800);
      }

      /* --------------------------------------------------------------------------
       * Standalone SVG XML Serializer (Always full opacity, XML header included)
       * -------------------------------------------------------------------------- */
      function getStandaloneSvgXml() {
        const clone = svgEl.cloneNode(true);
        clone.setAttribute('xmlns', SVG_NS);
        clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
        clone.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
        clone.setAttribute('width', String(SVG_W));
        clone.setAttribute('height', String(SVG_H));

        // Reset any interactive UI opacity dimming so export is always 100% crisp
        clone.querySelectorAll('g[data-layer]').forEach((g) => {
          g.removeAttribute('style');
        });

        const serializer = new XMLSerializer();
        const raw = serializer.serializeToString(clone);
        return `<?xml version="1.0" encoding="UTF-8"?>\n${raw}`;
      }

      /* Export 1: Download .SVG */
      document.getElementById('btn-export-svg').addEventListener('click', () => {
        try {
          const xml = getStandaloneSvgXml();
          const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'aegislake-architecture.svg';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast('Downloaded standalone aegislake-architecture.svg');
        } catch (err) {
          console.error(err);
          showToast('Failed to export SVG file.', 'error');
        }
      });

      /* Export 2: High-Res 2x .PNG (3840x2860) */
      document.getElementById('btn-export-png').addEventListener('click', () => {
        try {
          const xml = getStandaloneSvgXml();
          const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const img = new Image();

          img.onload = () => {
            try {
              const scale = 2; // 3840x2860 ultra-crisp executive export
              const canvas = document.createElement('canvas');
              canvas.width = SVG_W * scale;
              canvas.height = SVG_H * scale;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#F8FAFC';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.scale(scale, scale);
              ctx.drawImage(img, 0, 0, SVG_W, SVG_H);

              const pngUrl = canvas.toDataURL('image/png');
              const a = document.createElement('a');
              a.href = pngUrl;
              a.download = 'aegislake-architecture.png';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              showToast('Exported 2x High-Res PNG (3840\u00d72860)');
            } catch (canvasErr) {
              console.error(canvasErr);
              showToast('PNG rasterization failed in browser.', 'error');
            } finally {
              URL.revokeObjectURL(url);
            }
          };

          img.onerror = () => {
            URL.revokeObjectURL(url);
            showToast('Could not render SVG for PNG export.', 'error');
          };

          img.src = url;
        } catch (err) {
          console.error(err);
          showToast('PNG export error.', 'error');
        }
      });

      /* Export 3: Copy Standalone SVG Code (iframe-safe document.execCommand) */
      document.getElementById('btn-copy-svg').addEventListener('click', () => {
        try {
          const xml = getStandaloneSvgXml();
          const ta = document.createElement('textarea');
          ta.value = xml;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);

          if (ok) {
            showToast('Standalone SVG XML copied to clipboard!');
          } else {
            showToast('Clipboard copy blocked — use Download .SVG instead.', 'error');
          }
        } catch (err) {
          console.error(err);
          showToast('Could not copy SVG code.', 'error');
        }
      });

      /* Initial Fit-to-Screen on load & responsive resize */
      window.addEventListener('load', fitToScreen);
      window.addEventListener('resize', fitToScreen);
      fitToScreen();
    })();
  </script>
