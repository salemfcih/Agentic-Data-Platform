apiVersion: v3.0.2
kind: DataContract
id: dp-claims-risk-gold-v1
version: 1.2.0
status: active
name: Certified Claims Risk & Eligibility Gold Data Product
domain: benefits-and-claims
tenant: enterprise-core

ownership:
  businessOwner: head-of-claims-analytics@enterprise.example
  technicalSteward: data-platform-engineering@enterprise.example
  governanceBoard: enterprise-data-architecture-board

sla:
  freshnessMinutes: 15
  availabilityPercent: 99.95
  retentionDays: 2555
  wapBranchingRequired: true
  selfHealingPolicy: quarantine_and_notify

storage:
  catalog: apache-polaris
  metalake: apache-gravitino
  format: apache-iceberg-v3
  namespace: gold.claims
  table: claim_risk_features_daily

schema:
  - name: claim_id
    type: string
    primaryKey: true
    nullable: false
    classification: internal
  - name: beneficiary_token
    type: string
    nullable: false
    classification: pii-tokenized
    maskingPolicy: ranger_pii_hash_mask
  - name: claim_amount_sar
    type: decimal(18,2)
    nullable: false
    classification: confidential
    qualityRules:
      - type: range
        min: 0.01
        max: 10000000.00
  - name: fraud_risk_score
    type: double
    nullable: false
    qualityRules:
      - type: range
        min: 0.0
        max: 1.0
  - name: event_timestamp_utc
    type: timestamp
    nullable: false

qualityGates:
  engine: soda-v4
  checks:
    - row_count > 0
    - missing_count(claim_id) = 0
    - duplicate_count(claim_id) = 0
    - anomaly_score(avg(claim_amount_sar)) < 3.0
  onFailure:
    promoteToMain: false
    emitOpenLineageEvent: true
    triggerAgent: wap_reliability_agent
